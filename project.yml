name: FolderCustomizer
options:
  bundleIdPrefix: com.frank515
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
targets:
  FolderCustomizer:
    type: application
    platform: macOS
    sources:
      - path: Sources/FolderCustomizer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.frank515.FolderCustomizer
        PRODUCT_NAME: FolderCustomizer
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: FolderCustomizer
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
